; ==============================================================================
; extensions.conf — Etisalcom BYOC Dialplan
; DID: 13396999  |  Country: Bahrain (+973)
; ==============================================================================

[general]
static=yes
writeprotect=no

; ── Inbound from Etisalcom ────────────────────────────────────────────────────
[from-etisalcom]
; Match the DID Etisalcom sends in the INVITE Request-URI
exten => 13396999,1,NoOp(=== Inbound call from Etisalcom DID 13396999 ===)

 ; E.164 normalization: prepend +973 if not already present
 same => n,Set(CALLERID(num)=${IF($["${CALLERID(num):0:4}" != "+973"]?+973${CALLERID(num)}:${CALLERID(num)})})
 same => n,NoOp(Normalized CallerID: ${CALLERID(num)})

 ; Tag the call source for logging
 same => n,Set(CHANNEL(accountcode)=ETISALCOM-BYOC)

 ; Dial toward Amazon Chime Voice Connector
 ; Replace REPLACE_WITH_CHIME_VC_HOSTNAME after Step 4
 same => n,Dial(PJSIP/sip:13396999@chime-vc-endpoint,30,gU(e164-fixup))
 same => n,Hangup()

; Catch-all for any other DID Etisalcom might send
exten => _X.,1,NoOp(Unexpected DID: ${EXTEN} — sending to Chime)
 same => n,Set(CALLERID(num)=${IF($["${CALLERID(num):0:4}" != "+973"]?+973${CALLERID(num)}:${CALLERID(num)})})
 same => n,Dial(PJSIP/sip:${EXTEN}@chime-vc-endpoint,30)
 same => n,Hangup()

; ── Sub-routine: ensure outbound CallerID is E.164 ───────────────────────────
[e164-fixup]
exten => s,1,NoOp(e164-fixup: ensuring E.164 on outbound leg)
 same => n,Return()

; ── Inbound from Amazon Connect (outbound calls) ─────────────────────────────
[from-chime]
exten => _X.,1,NoOp(=== Outbound from Amazon Connect via Chime ===)
 same => n,Dial(PJSIP/${EXTEN}@etisalcom-endpoint,30)
 same => n,Hangup()
