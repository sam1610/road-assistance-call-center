; ==============================================================================
; pjsip.conf — Etisalcom BYOC SBC
; Generated for: Road Assistance Call Center
; Etisalcom SIP domain : fts.etisalcom.net (80.95.208.177)
; SIP number           : 13396999
; Chime VC hostname    : REPLACE_WITH_CHIME_VC_HOSTNAME (set after Step 4)
; ==============================================================================

[global]
type=global
user_agent=RoadAssist-SBC-v1

; ── Transport ─────────────────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Replace INSTANCE_PRIVATE_IP with the EC2 private IP (e.g. 172.31.x.x)
local_net=INSTANCE_PRIVATE_IP/16
external_media_address=INSTANCE_EIP
external_signaling_address=INSTANCE_EIP

; ── Etisalcom Registration ────────────────────────────────────────────────────
[etisalcom-reg]
type=registration
outbound_auth=etisalcom-auth
server_uri=sip:fts.etisalcom.net
client_uri=sip:13396999@fts.etisalcom.net
retry_interval=60
expiration=3600
outbound_proxy=sip:fts.etisalcom.net\;lr

[etisalcom-auth]
type=auth
auth_type=userpass
username=13396999
; Password injected by /etc/asterisk/load-secret.sh at boot — never hardcoded
password=ETISALCOM_PASSWORD_PLACEHOLDER
realm=fts.etisalcom.net

[etisalcom-aor]
type=aor
contact=sip:fts.etisalcom.net:5060
qualify_frequency=30

[etisalcom-endpoint]
type=endpoint
context=from-etisalcom
transport=transport-udp
disallow=all
allow=ulaw
outbound_auth=etisalcom-auth
aors=etisalcom-aor
from_domain=fts.etisalcom.net
from_user=13396999
direct_media=no
rtp_symmetric=yes
force_rport=yes
ice_support=no

; Identify Etisalcom by resolved IP — more robust than hostname matching
[etisalcom-identify]
type=identify
endpoint=etisalcom-endpoint
match=80.95.208.177

; ── Amazon Chime Voice Connector Trunk ───────────────────────────────────────
; Replace REPLACE_WITH_CHIME_VC_HOSTNAME after provisioning the Voice Connector
[chime-vc-aor]
type=aor
contact=sip:REPLACE_WITH_CHIME_VC_HOSTNAME:5060
qualify_frequency=30

[chime-vc-endpoint]
type=endpoint
context=from-chime
transport=transport-udp
disallow=all
allow=ulaw
aors=chime-vc-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
ice_support=no
